# Baseline testbed: a vulnerable target behind the OWASP CRS container.
#
# STATUS: syntax-checked only. NOT yet run. Image names and environment variable
# names below come from memory of the upstream projects and must be checked
# against each image's documentation before the first run.
#
# Purpose: produce the ModSecurity + CRS baseline numbers that every later
# result is compared against. This is a baseline, not the engine we will ship:
# the CRS project documents ModSecurity v3 as failing 2-4% of CRS unit tests,
# while Coraza passes the CRS v4 suite.
#
#   docker compose -f deploy/compose.yml up
#   target directly:   http://localhost:${TARGET_PORT:-13000}
#   through baseline:  http://localhost:${BASELINE_PORT:-8081}
#
# Overridable settings (all have defaults, see docker compose config):
#   TARGET_PORT         host port for the direct target   (default 13000)
#   BASELINE_PORT       host port for the CRS baseline    (default 8081)
#   MODSEC_RULE_ENGINE  DetectionOnly | On                (default DetectionOnly)
#   PARANOIA            1 | 2 | ...                       (default 1)

services:
  target:
    image: bkimminich/juice-shop:v20.4.0  # https://hub.docker.com/r/bkimminich/juice-shop/tags (tag v20.4.0)
    expose:
      - "3000"
    ports:
      # DEVIATION step-01: host port 3000 was already occupied by an unrelated
      # process on this machine, so the target is published on 13000 instead.
      # Container-side port is unchanged (3000).
      - "${TARGET_PORT:-13000}:3000"      # direct access, for the "no WAF" control run

  baseline-crs:
    # Step-12: pinned by digest. The floating tag moved upstream on 2026-11-19
    # (new build 98d448750b86..., pulled by a compose run on 2026-11-20); this
    # digest is the image every previous ModSecurity run used (step-01 record,
    # re-verified 2026-11-20 by docker pull - still available).
    image: owasp/modsecurity-crs:4.25.2-nginx-lts@sha256:6296ce685cb88ba4012998b935b25dabbd9e0ff326088c1149447102544de661
    depends_on:
      - target
    environment:
      # Env var names verified against:
      #   https://github.com/coreruleset/modsecurity-crs-docker#common-env-variables (BACKEND, PARANOIA, MODSEC_RULE_ENGINE, PORT)
      #   https://github.com/coreruleset/modsecurity-crs-docker/blob/main/src/etc/modsecurity.d/modsecurity.conf (SecRuleEngine ${MODSEC_RULE_ENGINE})
      # Step-09 T5: backend selectable. Default stays Juice Shop; set
      # BACKEND=http://stub-backend:3000 (and start the stub-backend service)
      # for runs against the neutral stub.
      BACKEND: "${BACKEND:-http://target:3000}"       # backend URL (README: "Partial URL for the remote server")
      PARANOIA: "${PARANOIA:-1}"                       # run 1, then 2, as separate labelled runs
      # Step-05 finding: the image bakes BLOCKING_PARANOIA=1 into its ENV, so
      # PARANOIA alone only raised detection_paranoia_level (blocking stayed 1).
      # Pin both levels explicitly to PARANOIA unless overridden.
      BLOCKING_PARANOIA: "${BLOCKING_PARANOIA:-${PARANOIA:-1}}"
      DETECTION_PARANOIA: "${DETECTION_PARANOIA:-${PARANOIA:-1}}"
      MODSEC_RULE_ENGINE: "${MODSEC_RULE_ENGINE:-DetectionOnly}" # DetectionOnly logs without blocking
      # Step-05 T4: policy-aligned config knobs; empty/undefined = image default.
      ALLOWED_METHODS: "${ALLOWED_METHODS:-}"
      ALLOWED_REQUEST_CONTENT_TYPE: "${ALLOWED_REQUEST_CONTENT_TYPE:-}"
    ports:
      - "${BASELINE_PORT:-8081}:8080"     # container listens on PORT, default 8080 (README: Server and Port Configuration)

  # Step-09 T5: neutral stub backend. Returns 200 + fixed HTML for any
  # method/path; no state, no 4xx/5xx of its own. Used for the WCP benign
  # baseline so every non-200 is attributable to the WAF.
  stub-backend:
    image: python:3.12-alpine
    volumes:
      - ../tools/stub_backend.py:/stub_backend.py:ro
    command: ["python3", "/stub_backend.py", "3000"]
    expose:
      - "3000"

  # Step-10 T8: Coraza engine for the parity check. Distribution chosen:
  # coreruleset/coraza-crs-docker (https://github.com/coreruleset/coraza-crs-docker),
  # nginx variant - same reverse-proxy shape as the baseline image, same env
  # knobs (BACKEND, PARANOIA, BLOCKING_PARANOIA, CORAZA_RULE_ENGINE), and it
  # bundles CRS. Pinned by tag + digest; CRS version must equal the baseline's
  # 4.25.2 (verified from inside both containers, rule 28).
  # Started only with --profile coraza; never runs WCP traffic (task T8).
  coraza-crs:
    # Step-12: re-pinned. The step-10/11 digest ffefe71585b42... was DELETED
    # from ghcr.io (docker pull 2026-11-20: "not found"), so the old image is
    # unobtainable; the tag now resolves to this newer build (created
    # 2026-11-13). Engine inside: coraza/v3@v3.7.0 (Go build info in
    # /usr/local/lib/libcoraza.so); CRS still 4.25.2 (verified in-container).
    # DETECTION_PARANOIA is now honoured by this image's activate-rules.sh
    # (the ffefe715 image ignored it and fell back to 901125).
    image: ghcr.io/coreruleset/coraza-crs:4.25.2-nginx-lts@sha256:bfbfe70b4445c1ef1dc389c2de12cfdb194c9616746c33dc8a7131461c28f4a6
    profiles:
      - coraza
    depends_on:
      - target
    environment:
      BACKEND: "${CORAZA_BACKEND:-http://target:3000}"
      PARANOIA: "${PARANOIA:-1}"
      BLOCKING_PARANOIA: "${BLOCKING_PARANOIA:-${PARANOIA:-1}}"
      DETECTION_PARANOIA: "${DETECTION_PARANOIA:-}"
      CORAZA_RULE_ENGINE: "${CORAZA_RULE_ENGINE:-On}"
      CORAZA_AUDIT_ENGINE: "${CORAZA_AUDIT_ENGINE:-RelevantOnly}"
      CORAZA_AUDIT_LOG: "${CORAZA_AUDIT_LOG:-/var/log/coraza/audit/audit.log}"
    ports:
      - "8082:8080"

  # Added in a later phase, once the harness has recorded baseline numbers:
  # kortex-proxy:  Coraza-based engine, same CRS version, same target.

# Step-09: audit-log capture change — see docs/baseline-config.md. After the
# container starts, redirect the ModSecurity audit log to a file inside the
# container (tools/run_wcp_baselines.sh does this via docker exec + nginx
# reload) so captures are not corrupted by interleaved stdout writes.
